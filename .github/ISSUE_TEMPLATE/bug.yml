name: Bug report
description: Report reproducible incorrect behavior without sensitive data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, tokens, email addresses, full serial numbers, private location names, or raw cloud responses.
  - type: input
    id: version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: input
    id: home_assistant
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: dropdown
    id: device_family
    attributes:
      label: Device family
      options: [Ghost, Diamond, Icon, Gemini, Other or unknown]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior and provide minimal reproduction steps.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics or logs
      description: Attach only Home Assistant diagnostics or logs after checking that sensitive values are absent.

name: Dependency audit

on:
  pull_request:
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"
      - run: python -m pip install pip-audit
      - run: pip-audit --strict

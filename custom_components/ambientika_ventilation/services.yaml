set_state:
  target:
    entity:
      integration: ambientika_ventilation
      domain: fan
  fields:
    operating_mode:
      selector:
        select:
          options:
            - smart
            - auto
            - heat_recovery
            - night
            - away
            - surveillance
            - timed_extraction
            - extraction
            - intake
            - master_slave_flow
            - slave_master_flow
            - "off"
    fan_speed:
      selector:
        select:
          options:
            - low
            - medium
            - high
            - turbo
    humidity_level:
      selector:
        select:
          options:
            - dry
            - normal
            - moist
    light_sensor_level:
      selector:
        select:
          options:
            - "off"
            - low
            - medium

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-ambientika-ventilation"
version = "1.0.0-beta.1"
description = "Unofficial Home Assistant integration for Ambientika ventilation systems"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
authors = [{ name = "SoftwareSchmied" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
security = [
  "pip-audit==2.10.1",
]
test = [
  "homeassistant==2026.10.4",
  "pytest-homeassistant-custom-component==0.13.375",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.4",
  "mypy==2.4.1",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=custom_components.ambientika_ventilation --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=98"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["custom_components/ambientika_ventilation"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "D", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = [
  "ANN401",
  "COM812",
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "ARG001", "D", "PLR2004", "S101", "SLF001"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/ambientika_ventilation"]
ignore_missing_imports = true
exclude = ["tests"]

[[tool.mypy.overrides]]
# Inside Home Assistant (2026.9+) `voluptuous` is an alias of `probatio`
# (installed by `homeassistant/__init__.py`); mypy sees two packages, so treat
# voluptuous as untyped instead of reporting false schema type mismatches.
module = ["voluptuous", "voluptuous.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# Platform packages re-export their constants (for example FanEntityFeature)
# without `__all__`; core integrations import them the same way.
module = ["homeassistant.components.*"]
implicit_reexport = true
